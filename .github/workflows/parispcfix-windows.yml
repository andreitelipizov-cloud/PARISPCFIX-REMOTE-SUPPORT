name: PARISPCFIX Windows installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.75'
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true
      - name: Generate the bridge in CI
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          sed -i 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          cd flutter
          flutter pub get
          cd ..
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: parispcfix-bridge
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            flutter/macos/Runner/bridge_generated.h
          if-no-files-found: error

  windows:
    needs: bridge
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        edition: [client, admin]
    env:
      PARISPCFIX_EDITION: ${{ matrix.edition }}
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
      VCPKG_BINARY_SOURCES: clear
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: parispcfix-bridge
          path: .
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: '15.0.6'
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          flutter-version: '3.24.5'
          channel: stable
          architecture: x64
          cache: true
      - name: Prepare the matching Flutter engine
        shell: pwsh
        run: |
          flutter precache --windows
          if ($LASTEXITCODE -ne 0) { throw 'Flutter precache failed' }
          Invoke-WebRequest 'https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip' -OutFile windows-x64-release.zip
          Expand-Archive windows-x64-release.zip windows-x64-release
          $flutterRoot = Split-Path (Split-Path (Get-Command flutter).Source)
          Copy-Item windows-x64-release/* "$flutterRoot/bin/cache/artifacts/engine/windows-x64-release/" -Recurse -Force
          git -C $flutterRoot apply "$PWD/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          if ($LASTEXITCODE -ne 0) { throw 'Flutter patch failed' }
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.75'
          targets: x86_64-pc-windows-msvc
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
      - name: Build native dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT/vcpkg.exe" install --triplet x64-windows-static "--x-install-root=$env:VCPKG_ROOT/installed"
          if ($LASTEXITCODE -ne 0) { throw 'Native dependencies failed' }
      - name: Analyze the branded Flutter sources
        shell: pwsh
        run: |
          Set-Location flutter
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Flutter dependencies failed' }
          flutter analyze lib/parispcfix/brand.dart
          if ($LASTEXITCODE -ne 0) { throw 'Brand analysis failed' }
      - name: Build the integrated application and installer
        shell: pwsh
        run: |
          python3 build.py --portable --flutter --hwcodec --vram
          if ($LASTEXITCODE -ne 0) { throw 'Application build failed' }
          cargo test --locked --release --lib --features "flutter,hwcodec,vram,parispcfix-$env:PARISPCFIX_EDITION" parispcfix::tests
          if ($LASTEXITCODE -ne 0) { throw 'Branding tests failed' }
      - name: Include licenses and build provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path parispcfix/dist -Force | Out-Null
          $name = 'PARISPCFIX-' + $env:PARISPCFIX_EDITION.ToUpperInvariant()
          Get-ChildItem "$name-*-install.exe" | Copy-Item -Destination parispcfix/dist
          Copy-Item LICENCE parispcfix/dist/LICENCE-AGPL-3.0.txt
          Copy-Item parispcfix/README.md parispcfix/dist/README.md
          git rev-parse HEAD | Set-Content parispcfix/dist/source-commit.txt
          Get-ChildItem parispcfix/dist -Filter '*.exe' | Get-FileHash -Algorithm SHA256 | Format-List | Out-File parispcfix/dist/SHA256.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PARISPCFIX-${{ matrix.edition }}-Windows-x64
          path: parispcfix/dist/
          if-no-files-found: error
