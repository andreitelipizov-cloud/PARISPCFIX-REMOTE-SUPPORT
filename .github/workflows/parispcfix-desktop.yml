name: PARISPCFIX macOS and Linux

on:
  workflow_dispatch:
  push:
    branches: [master, 'parispcfix/desktop-design']
    paths:
      - 'src/parispcfix.rs'
      - 'src/parispcfix/**'
      - 'src/client.rs'
      - 'src/server/connection.rs'
      - '.github/workflows/parispcfix-desktop.yml'
      - 'parispcfix/build_desktop.py'
      - 'parispcfix/patch_flutter.py'
      - 'parispcfix/DESKTOP-RELEASE.md'
      - 'flutter/lib/parispcfix/**'
      - 'flutter/lib/desktop/pages/desktop_home_page.dart'
      - 'flutter/test/parispcfix_brand_test.dart'

permissions:
  contents: read

concurrency:
  group: parispcfix-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Reject unprotected PARISPCFIX sessions
        run: |
          rustc --edition=2021 --test src/parispcfix/security.rs -o "$RUNNER_TEMP/parispcfix-security-tests"
          "$RUNNER_TEMP/parispcfix-security-tests"

  bridge:
    uses: ./.github/workflows/bridge.yml

  desktop:
    name: ${{ matrix.platform.label }} / ${{ matrix.edition }}
    needs: [bridge, security]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        edition: [client, admin]
        platform:
          - {label: Linux-x64, runner: ubuntu-22.04, rust: '1.75', flutter: '3.24.5', target: x86_64-unknown-linux-gnu, triplet: x64-linux, bridge: bridge-artifact}
          - {label: macOS-Intel, runner: macos-26-intel, rust: '1.81', flutter: '3.24.5', target: x86_64-apple-darwin, triplet: x64-osx, bridge: bridge-artifact}
          - {label: macOS-AppleSilicon, runner: macos-15, rust: '1.81', flutter: '3.44.9', target: aarch64-apple-darwin, triplet: arm64-osx, bridge: bridge-artifact-flutter-3.44}
    env:
      PARISPCFIX_EDITION: ${{ matrix.edition }}
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.platform.triplet }}
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.platform.triplet }}
      VCPKG_BINARY_SOURCES: clear
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # LLVM's slotted unwind headers conflict with GStreamer's libunwind-dev.
          sudo apt-get install -y libunwind-dev libunwind-14-dev-
          sudo apt-get install -y build-essential clang cmake curl git libayatana-appindicator3-dev libasound2-dev libclang-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev libssl-dev libwayland-dev wayland-protocols llvm nasm ninja-build pkg-config unzip xz-utils desktop-file-utils xvfb
          python -m pip install cmake==4.3.0
      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install llvm gnu-sed
          command -v pkg-config || brew install pkg-config
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          python -m pip install cmake==4.3.0
          curl --fail --location https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip --output "$RUNNER_TEMP/nasm.zip"
          unzip -q "$RUNNER_TEMP/nasm.zip" -d "$RUNNER_TEMP/nasm"
          chmod +x "$RUNNER_TEMP/nasm/nasm-2.16.03/nasm"
          echo "$RUNNER_TEMP/nasm/nasm-2.16.03" >> "$GITHUB_PATH"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ matrix.platform.flutter }}
          cache: true
      - name: Prepare matching Flutter sources
        shell: bash
        run: |
          if [[ '${{ matrix.platform.label }}' == 'macOS-AppleSilicon' ]]; then
            flutter config --no-enable-swift-package-manager
            bash .github/patches/apply_flutter_3.44_source_patches.sh
          else
            python parispcfix/patch_flutter.py
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ matrix.platform.bridge }}
          path: .
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ matrix.platform.rust }}
          targets: ${{ matrix.platform.target }}
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: parispcfix-${{ matrix.platform.label }}-${{ matrix.edition }}
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
      - name: Build native libraries
        shell: bash
        run: '"$VCPKG_ROOT/vcpkg" install --triplet "${{ matrix.platform.triplet }}" --x-install-root="$VCPKG_ROOT/installed"'
      - name: Validate the interface and packaging
        shell: bash
        run: |
          python -m unittest discover -s parispcfix -p 'test_desktop.py'
          cd flutter
          flutter pub get
          flutter analyze lib/parispcfix/brand.dart
          flutter test test/parispcfix_brand_test.dart --dart-define=PARISPCFIX=true --dart-define=PARISPCFIX_EDITION=${{ matrix.edition }}
      - name: Build and package CLIENT or ADMIN
        shell: bash
        run: python parispcfix/build_desktop.py --edition '${{ matrix.edition }}'
      - name: Verify Linux application and package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a timeout 30s flutter/build/linux/x64/release/bundle/rustdesk --version
          find parispcfix/dist -name '*.deb' -exec dpkg-deb --info {} \;
          find parispcfix/dist -name '*.tar.gz' -exec tar -tzf {} \; > "$RUNNER_TEMP/bundle-files.txt"
      - name: Verify macOS engine architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          file target/release/liblibrustdesk.dylib target/release/service
          expected_arch='${{ matrix.platform.target == 'aarch64-apple-darwin' && 'arm64' || 'x86_64' }}'
          lipo target/release/liblibrustdesk.dylib -verify_arch "$expected_arch"
          lipo target/release/service -verify_arch "$expected_arch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PARISPCFIX-${{ matrix.edition }}-${{ matrix.platform.label }}
          path: parispcfix/dist/
          if-no-files-found: error
          retention-days: 30
